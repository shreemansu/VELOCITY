<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOCITY — Verify OTP</title>
<link rel="stylesheet" href="verify.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="car-strip"></div>

<div class="card">

  <div class="brand">
    <div class="brand-icon">🚗</div>
    <span class="brand-name">Velocity</span>
  </div>

  <!-- FORM STATE -->
  <div id="formState">

    <div class="otp-icon">📩</div>
    <div class="card-title">VERIFY EMAIL</div>
    <p class="card-subtitle">
      We sent a 6-digit OTP to<br>
      <span id="emailDisplay">your email</span>
    </p>

    <div class="alert" id="alertBox"></div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <div class="input-wrap">
        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="rahul@example.com"
        />
        <span class="input-icon">✉</span>
      </div>
    </div>

    <!-- OTP Boxes -->
    <label class="otp-label">Enter OTP</label>
    <div class="otp-boxes">
      <input class="otp-box" id="o1" maxlength="1" type="text" inputmode="numeric" />
      <input class="otp-box" id="o2" maxlength="1" type="text" inputmode="numeric" />
      <input class="otp-box" id="o3" maxlength="1" type="text" inputmode="numeric" />
      <input class="otp-box" id="o4" maxlength="1" type="text" inputmode="numeric" />
      <input class="otp-box" id="o5" maxlength="1" type="text" inputmode="numeric" />
      <input class="otp-box" id="o6" maxlength="1" type="text" inputmode="numeric" />
    </div>

    <!-- Timer + Resend -->
    <div class="timer-row">
      <span class="timer-text">OTP expires in <span class="timer-count" id="timerDisplay">02:00</span></span>
      <button class="resend-btn" id="resendBtn" onclick="resendOtp()">Resend OTP</button>
    </div>

    <!-- Verify Button -->
    <button class="btn-verify" id="verifyBtn" onclick="verify()">
      <span id="btnText">VERIFY OTP</span>
      <div class="btn-loader" id="btnLoader"></div>
    </button>

  </div>

  <!-- SUCCESS STATE -->
  <div class="success-state" id="successState">
    <div class="success-checkmark">✅</div>
    <div class="success-title">VERIFIED!</div>
    <p class="success-msg">Your account is confirmed.<br>Redirecting to login...</p>
  </div>

</div>

<script src="verify.js"></script>

</body>
</html>
