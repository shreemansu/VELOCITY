<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOCITY — Login</title>
<link rel="stylesheet" href="./login.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="car-strip"></div>

<div class="layout">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="brand">
      <div class="brand-icon">🚗</div>
      <span class="brand-name">Velocity</span>
    </div>

    <div class="hero-text">
      <h1>DRIVE<span>YOUR</span>WAY.</h1>
      <p>Premium car rentals at your fingertips. Book, drive, return — it's that simple.</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">120+</div>
        <div class="stat-label">Cars</div>
      </div>
      <div class="stat">
        <div class="stat-num">4K+</div>
        <div class="stat-label">Users</div>
      </div>
      <div class="stat">
        <div class="stat-num">24/7</div>
        <div class="stat-label">Support</div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="login-card">

      <div class="card-header">
        <h2>WELCOME BACK</h2>
        <p>Sign in to access your rentals</p>
      </div>

      <!-- Alert Box -->
      <div class="alert" id="alertBox"></div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <span class="input-icon">✉</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <span class="input-icon">🔒</span>
          <button class="eye-btn" id="eyeBtn" type="button" onclick="togglePassword()">👁</button>
        </div>
      </div>

      <!-- Login Button -->
      <button class="btn-login" id="loginBtn" onclick="login()">
        <span id="btnText">START ENGINE</span>
        <div class="btn-loader" id="btnLoader"></div>
      </button>

      <div class="divider">or</div>

      <div class="register-link">
        Don't have an account? <a href="../register/register.html">Register here</a>
      </div>

    </div>
  </div>

</div>

<script src="./login.js" defer></script>

</body>
</html>
